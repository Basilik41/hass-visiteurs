ajouter:
  fields:
    nom: {required: true, example: Marc, selector: {text: {}}}
    type:
      default: sur_place
      selector: {select: {options: [{value: sur_place, label: Reste sur place}, {value: passage, label: Passage}]}}
    debut: {selector: {datetime: {}}}
    fin: {selector: {datetime: {}}}
    duree: {selector: {number: {min: 0.25, max: 1440, step: 0.25, unit_of_measurement: h, mode: box}}}
    plaques: {example: "AB-123-CD", selector: {text: {}}}
    telephone: {selector: {text: {type: tel}}}
    note: {selector: {text: {multiline: true}}}
    code: {selector: {boolean: {}}}
    acces: {selector: {entity: {multiple: true}}}
    alarme: {selector: {boolean: {}}}
    notifications:
      selector:
        select:
          options:
            - {value: auto, label: "Par défaut (régulière : journal ; sinon : téléphones)"}
            - {value: telephones, label: Téléphones}
            - {value: journal, label: Journal seulement}
            - {value: aucune, label: Aucune}
    repetition_jours:
      selector:
        select:
          multiple: true
          options:
            - {value: lundi, label: Lundi}
            - {value: mardi, label: Mardi}
            - {value: mercredi, label: Mercredi}
            - {value: jeudi, label: Jeudi}
            - {value: vendredi, label: Vendredi}
            - {value: samedi, label: Samedi}
            - {value: dimanche, label: Dimanche}
    heure_debut: {example: "08:00", selector: {time: {}}}
    heure_fin: {example: "12:00", selector: {time: {}}}
    toutes_les: {default: 1, selector: {number: {min: 1, max: 12, step: 1, unit_of_measurement: semaine(s), mode: box}}}
    jusqu_au: {selector: {date: {}}}
